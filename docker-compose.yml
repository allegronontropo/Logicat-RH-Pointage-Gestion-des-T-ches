services:
  db:
    image: postgres:16-alpine
    container_name: logicat_rh_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-logicat_rh}
      POSTGRES_USER: ${DB_USER:-logicat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logicat} -d ${DB_NAME:-logicat_rh}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: logicat_rh_pgdata
